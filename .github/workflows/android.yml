name: Android

on: [push, pull_request]

env:
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPRESS: true
  CCACHE_MAXSIZE: 400M
  CC: gcc
  OS_NAME: linux

jobs:
  android:
    # branches of this repository are built on push, so only build pull
    # requests that come from forks
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-22.04
    env:
      TEST: android
      # since the NDK is newly installed every time, we have to use this to avoid cache misses
      CCACHE_COMPILERCHECK: content
    steps:
      # we currently don't specify a specific NDK version in our gradle files,
      # so we load the version the Gradle Plugin uses as default but which is
      # not installed anymore in the image
      - name: Install NDK
        run: yes | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install 'ndk;21.4.7075529'
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-android-${{ github.sha }}
          restore-keys: |
            ccache-android-
      - run: |
          sudo apt-get install -qq ccache
          echo "PATH=/usr/lib/ccache:$PATH" >> $GITHUB_ENV
          ccache -z
      - uses: ./.github/actions/default
      - run: ccache -s
      - uses: actions/upload-artifact@v4
        with:
          name: Lint Results
          path: src/frontends/android/app/build/reports/lint-results.xml
