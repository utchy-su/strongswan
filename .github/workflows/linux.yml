name: Linux

on: [push, pull_request]

env:
  # this test case does not actually test anything but tries to access system
  # directories that might be inaccessible on build hosts
  TESTS_CASES_EXCLUDE: sw_collector
  TESTS_REDUCED_KEYLENGTHS: yes
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPRESS: true
  CCACHE_MAXSIZE: 200M
  OS_NAME: linux
  DEBIAN_FRONTEND: noninteractive

jobs:
  latest:
    # branches of this repository are built on push, so only build pull
    # requests that come from forks
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-22.04
    # scripts/test.sh targets Ubuntu 20.04, for which no hosted runner exists
    # anymore, so run the build in a container
    container:
      image: ubuntu:20.04
      # LeakSanitizer requires ptrace
      options: --cap-add SYS_PTRACE --security-opt seccomp=unconfined
    strategy:
      fail-fast: false
      matrix:
        test: [ all, default, printf-builtin ]
        compiler: [ gcc, clang ]
        leak-detective: [ no, yes ]
        monolithic: [ no, yes ]
        exclude:
          # leaks will show up whether we build monolithic or not
          - leak-detective: yes
            monolithic: yes
          # monolithic builds don't affect the printf-hook implementation
          - test: printf-builtin
            monolithic: yes
        include:
          - test: apidoc
          - test: coverage
          - test: dist
          - test: nm-no-glib
          - test: fuzzing
            compiler: clang
            monolithic: yes
    env:
      LEAK_DETECTIVE: ${{ matrix.leak-detective || 'no' }}
      MONOLITHIC: ${{ matrix.monolithic || 'no' }}
      CC: ${{ matrix.compiler || 'gcc' }}
      TEST: ${{ matrix.test }}
    steps:
      - name: Install tools that are preinstalled on hosted runners
        run: |
          apt-get update -qq
          apt-get install -qq sudo git curl wget ca-certificates lsb-release \
            build-essential clang llvm autoconf automake libtool pkg-config \
            python3 python3-pip python3-setuptools unzip
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.ccache
          # with regards to ccache, monolithic builds don't differ from regular
          # builds and, similarly, builds with leak-detective only differ in two
          # files (LD itself and library.c); but different tests build different
          # dependencies, so different caches are needed
          key: ccache-${{ runner.os }}-${{ env.CC }}-${{ matrix.test }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.CC }}-${{ matrix.test }}-
            ccache-${{ runner.os }}-${{ env.CC }}-
      - run: |
          sudo apt-get install -qq ccache
          echo "PATH=/usr/lib/ccache:$PATH" >> $GITHUB_ENV
          ccache -z
      - uses: ./.github/actions/default
      - run: ccache -s
      - if: ${{ success() && matrix.test == 'coverage' }}
        run: bash <(curl -s https://codecov.io/bash)
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: Logs ${{ github.job }} ${{ strategy.job-index }}
          path: config.log
          retention-days: 5

  crypto-plugins:
    # branches of this repository are built on push, so only build pull
    # requests that come from forks
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-22.04
    # scripts/test.sh targets Ubuntu 20.04, for which no hosted runner exists
    # anymore, so run the build in a container
    container:
      image: ubuntu:20.04
      # LeakSanitizer requires ptrace
      options: --cap-add SYS_PTRACE --security-opt seccomp=unconfined
    strategy:
      fail-fast: false
      matrix:
        test: [ botan, wolfssl, openssl, openssl-3, gcrypt ]
        leak-detective: [ no, yes ]
    env:
      LEAK_DETECTIVE: ${{ matrix.leak-detective || 'no' }}
      TEST: ${{ matrix.test }}
    steps:
      - name: Install tools that are preinstalled on hosted runners
        run: |
          apt-get update -qq
          apt-get install -qq sudo git curl wget ca-certificates lsb-release \
            build-essential clang llvm autoconf automake libtool pkg-config \
            python3 python3-pip python3-setuptools unzip
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ env.CC }}-${{ matrix.test }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.CC }}-${{ matrix.test }}-
            ccache-${{ runner.os }}-${{ env.CC }}-
            ccache-${{ runner.os }}-${{ env.CC }}-all-${{ github.sha }}
            ccache-${{ runner.os }}-${{ env.CC }}-all-
            ccache-${{ runner.os }}-${{ env.CC }}-
      - run: |
          sudo apt-get install -qq ccache
          echo "PATH=/usr/lib/ccache:$PATH" >> $GITHUB_ENV
          ccache -z
      - uses: ./.github/actions/default
      - run: ccache -s
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: Logs ${{ github.job }} ${{ strategy.job-index }}
          path: config.log
          retention-days: 5
