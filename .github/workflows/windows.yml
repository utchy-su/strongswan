name: Windows

on: [push, pull_request]

env:
  TESTS_REDUCED_KEYLENGTHS: yes
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPRESS: true
  CCACHE_MAXSIZE: 200M
  # since the compilers are newly installed every time, we have to use this to
  # avoid cache misses
  CCACHE_COMPILERCHECK: content
  MONOLITHIC: yes

jobs:
  cross-compile:
    # branches of this repository are built on push, so only build pull
    # requests that come from forks
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        test: [ win64, win32 ]
    env:
      OS_NAME: linux
      TEST: ${{ matrix.test }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ matrix.test }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.test }}-
      - run: |
          sudo apt-get install -qq ccache
          echo "PATH=/usr/lib/ccache:$PATH" >> $GITHUB_ENV
          ccache -z
      - uses: ./.github/actions/default
      - run: ccache -s
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: Logs ${{ github.job }} ${{ strategy.job-index }}
          path: config.log
          retention-days: 5
